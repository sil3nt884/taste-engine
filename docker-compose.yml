services:
  postgres:
    image: pgvector/pgvector:pg16
    # wal_level=logical + replication slots are required for Debezium CDC.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    environment:
      POSTGRES_USER: taste
      POSTGRES_PASSWORD: taste
      POSTGRES_DB: taste
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taste"]
      interval: 5s

  # Full-text search index. Holds only searchable fields + the Postgres id.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: masterKeyChangeMe    # must match MEILI_KEY in the app .env
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: ["meili_data:/meili_data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 5s

  # Kafka (KRaft, single node — no ZooKeeper). Two listeners: INTERNAL for other
  # containers (kafka:19092), HOST for the app on the host (localhost:9092).
  # Behind the "cdc" profile: a demo skips it (search is populated by
  # `npm run search:reindex`); full-live brings it up with `--profile cdc`.
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["cdc"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Kafka Connect bundled with the Debezium connectors. Register the Postgres
  # connector against its REST API (see debezium/register-media.json).
  connect:
    image: debezium/connect:2.7.3.Final
    profiles: ["cdc"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: taste-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

volumes:
  pgdata:
  meili_data:
