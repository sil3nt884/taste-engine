app = "taste-api"
primary_region = "lhr"

[build]
  # Path is relative to THIS file's dir (fly/). Deploy with the repo root as build
  # context: `fly deploy . -c fly/api.toml --dockerfile fly/Dockerfile.api`.
  dockerfile = "Dockerfile.api"

# Non-secret config only. Secrets (DATABASE_URL, JWT_SECRET, MEILI_HOST,
# MEILI_KEY, OLLAMA_HOST, OLLAMA_TOKEN) are set with `fly secrets set` — never
# commit them here. See fly/DEPLOY.md.
[env]
  LOG_LEVEL = "info"
  # Runtime must match what the catalogue was seeded against.
  ACTIVE_VOCABULARY_VERSION = "4"
  # These must match models you `ollama pull` on your home box (DEPLOY.md step 5).
  OLLAMA_MODEL = "llama3.1:8b"
  EMBED_MODEL = "mxbai-embed-large"
  EXPLAIN_MODEL = "llama3.2:3b"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0    # scales to zero; first request cold-starts

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"            # bump to 2gb temporarily for `npm run setup`
