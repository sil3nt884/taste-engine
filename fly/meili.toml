app = "taste-search"
primary_region = "lhr"

# Meilisearch. Internal-only: the API reaches it at taste-search.internal:7700.
# MEILI_MASTER_KEY is set as a secret (production mode requires a 16+ byte key).
[build]
  image = "getmeili/meilisearch:v1.10"

[env]
  MEILI_ENV = "production"
  MEILI_NO_ANALYTICS = "true"
  MEILI_HTTP_ADDR = "0.0.0.0:7700"

[mounts]
  source = "meili_data"
  destination = "/meili_data"

# Stateful — do not scale to zero.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
