app = "taste-search-mr"
primary_region = "lhr"

# Meilisearch. Internal-only: the API reaches it at taste-search-mr.internal:7700.
# MEILI_MASTER_KEY is set as a secret (production mode requires a 16+ byte key).
[build]
  image = "getmeili/meilisearch:v1.10"

[env]
  MEILI_ENV = "production"
  MEILI_NO_ANALYTICS = "true"
  # [::] = IPv6 (dual-stacks to IPv4). Fly's private .internal network is IPv6-only,
  # so 0.0.0.0 (IPv4-only) is unreachable app-to-app.
  MEILI_HTTP_ADDR = "[::]:7700"

[mounts]
  source = "meili_data"
  destination = "/meili_data"

# Stateful — do not scale to zero. 1GB: 512MB OOM-kills once the 5k-doc index is
# loaded (Meili's resident set is ~400MB+ with the catalogue indexed).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
